plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {

    namespace = "fr.azelart.artnetstack"
    compileSdkVersion 37
    defaultConfig {
        minSdkVersion 21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation libs.junit
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.dfredell'
                artifactId = 'ArtNetStack'
                version = '2.0.1'
            }
        }
    }
}

// JitPack looks for this task
tasks.register('install') {
    dependsOn 'publishToMavenLocal'
    group = 'publishing'
    description = 'Installs artifacts to local Maven repository (for JitPack)'
}
